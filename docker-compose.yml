services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: placement_analyzer
      POSTGRES_USER: pfa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfa -d placement_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://pfa:${POSTGRES_PASSWORD}@db:5432/placement_analyzer
      UPLOAD_DIR: /data/uploads/resumes
      CORS_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:8080}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    volumes:
      - placement_uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres_data:
  placement_uploads:
